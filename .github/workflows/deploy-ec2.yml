name: Deploy Backend to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_build:
        description: 'Skip build step (deploy existing dist)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  PM2_APP: hms-backend
  HEALTH_PATH: /health

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 5m
          script: |
            set -e

            APP_DIR="${{ secrets.EC2_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="/home/${{ secrets.EC2_USER }}/HMS--BACKEND"
            fi

            echo "═══════════════════════════════════════"
            echo "🚀 HMS Backend — EC2 Deployment"
            echo "═══════════════════════════════════════"
            echo "Directory: $APP_DIR"
            echo "Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""

            # Check if deployment script exists
            if [ -f "$APP_DIR/DEPLOY_TO_PRODUCTION.sh" ]; then
              echo "📜 Using DEPLOY_TO_PRODUCTION.sh"
              cd "$APP_DIR"
              chmod +x DEPLOY_TO_PRODUCTION.sh
              APP_DIR="$APP_DIR" BRANCH=main ./DEPLOY_TO_PRODUCTION.sh
            else
              echo "📜 Running inline deployment steps"
              cd "$APP_DIR"

              # Backup
              PREV_COMMIT=$(git rev-parse --short HEAD)
              echo "📦 Current commit: $PREV_COMMIT"

              # Pull latest
              git fetch --prune origin
              git reset --hard origin/main
              echo "📥 Updated to: $(git rev-parse --short HEAD)"

              # Install deps
              if [ -f package-lock.json ]; then
                npm ci --omit=dev
              else
                npm install --omit=dev
              fi

              # Generate Prisma client
              npx prisma generate

              # Build
              npm run build

              # Run migrations
              npm run prisma:migrate:deploy || true

              # Restart PM2
              if pm2 describe hms-backend > /dev/null 2>&1; then
                pm2 restart hms-backend --update-env
              else
                pm2 start ecosystem.config.js --only hms-backend --update-env
              fi

              # Health check
              sleep 3
              for i in 1 2 3 4 5; do
                if curl -fsS --max-time 8 "http://127.0.0.1:5000/health" > /dev/null 2>&1; then
                  echo "✅ Health check PASSED"
                  break
                fi
                echo "⏳ Waiting for startup... ($i/5)"
                sleep 2
              done

              curl -fsS --max-time 8 "http://127.0.0.1:5000/health" || {
                echo "❌ Health check FAILED — rolling back"
                git reset --hard "$PREV_COMMIT"
                npm ci --omit=dev && npm run build
                pm2 restart hms-backend --update-env
                exit 1
              }
            fi

            echo ""
            echo "═══════════════════════════════════════"
            echo "✅ Deployment Complete"
            echo "═══════════════════════════════════════"

      - name: Verify deployment externally
        if: success()
        run: |
          echo "Verifying external health endpoint..."
          sleep 5
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            "https://${{ secrets.EC2_HOST }}${{ env.HEALTH_PATH }}" || echo "000")

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ External health check PASSED (HTTP $HTTP_STATUS)"
          else
            echo "⚠️ External health check returned HTTP $HTTP_STATUS"
            echo "This may be expected if using IP instead of domain."
            echo "Check: https://${{ secrets.EC2_HOST }}${{ env.HEALTH_PATH }}"
          fi
